global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: macrosquare-spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["server:5846"]
        labels:
          application: macrosquare-server-spring

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
