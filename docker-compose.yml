services:
  # Jaeger 는 홈서버에 이미 외부 서비스로 기동 중 (이름 `jaeger`, :16686/:4318).
  # 중복 컨테이너 만들지 않고 host 네트워크로 forwarding (extra_hosts 로 host.docker.internal 해석).
  # 새 MacroSquare 서비스가 보내는 trace 는 service.name=macrosquare-server 로 tagging 되어
  # 기존 서비스 trace 와 UI 에서 구분됨.

  server:
    build: ./server
    container_name: macrosquare-server
    ports:
      - "5846:5846"
    volumes:
      - ./server/data:/app/data
      - ./server-logs:/app/logs
    environment:
      - PORT=5846
      - FRED_API_KEY=${FRED_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
      - OTEL_SERVICE_NAME=macrosquare-server
      - OTEL_TRACES_EXPORTER=otlp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        - NEXT_PUBLIC_API_URL=http://${HOST_IP:-localhost}:5846
    container_name: macrosquare-client
    ports:
      - "5847:5847"
    environment:
      - PORT=5847
      - HOSTNAME=0.0.0.0
      - SSR_API_URL=http://macrosquare-server:5846
    depends_on:
      - server
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
